{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}AI Interviewer{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <div class="container site-header-inner">
      <a class="brand" href="/">
        <span class="brand-mark">AI</span>
        <span class="brand-name">Interviewer</span>
      </a>
      <div style="margin-left:auto; display:flex; align-items:center; gap:16px;">
        <span class="brand-tag">Adaptive voice interviews</span>
        <a href="/sessions/" style="font-size:0.9rem; font-weight:600; text-decoration:none;">History</a>
      </div>
    </div>
  </header>
  <main class="container">{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
